l_english:
 qt_cp26_dominion_1:0 "The Great Link"
 qt_cp26_dominion_1_desc:0 "The Founders are the Dominion and the Dominion endures through the Great Link. Preserve their order through Vorta administration, Jem'Hadar strength and perfect control of information."
 qt_cp26_dominion_2:0 "Vorta Administration"
 qt_cp26_dominion_2_desc:0 "Vorta administrators turn the will of the Founders into quotas, treaties and reliable flows of resources. Maintain strong Energy and Mineral income."
 qt_cp26_dominion_3:0 "Worlds of the Dominion"
 qt_cp26_dominion_3_desc:0 "Order must extend beyond the Founders' homeworld. Control at least three colonized worlds."
 qt_cp26_dominion_4:0 "Obedience Brings Victory"
 qt_cp26_dominion_4_desc:0 "Every new world must understand its place in the hierarchy. Control five colonies and preserve enough Influence to enforce the Founders' will."
 qt_cp26_dominion_5:0 "Order in the Gamma Quadrant"
 qt_cp26_dominion_5_desc:0 "The Dominion is not a single world but a system of absolute order. Control seven colonies and sustain a powerful Unity income."
 qt_cp26_dominion_6:0 "The Jem'Hadar"
 qt_cp26_dominion_6_desc:0 "Jem'Hadar are bred to fight and die for the Founders. Field a battle-ready fleet worthy of their loyalty."
 qt_cp26_dominion_7:0 "The White"
 qt_cp26_dominion_7_desc:0 "Ketracel White sustains the Jem'Hadar and guarantees obedience. Secure a strategic reserve for the armies of the Dominion."
 qt_cp26_dominion_8:0 "Victory Is Life"
 qt_cp26_dominion_8_desc:0 "The Jem'Hadar recognize no distinction between duty and survival. Expand the fleet and accumulate the alloys needed to replace every loss."
 qt_cp26_dominion_9:0 "Dominion War Fleet"
 qt_cp26_dominion_9_desc:0 "Attack ships and battle cruisers must operate as a single relentless instrument. Field fourteen thousand fleet power and sustain mass ship production."
 qt_cp26_dominion_10:0 "Vorta Diplomacy"
 qt_cp26_dominion_10_desc:0 "A polite voice often opens a world more efficiently than a warship. Establish communications with two foreign empires."
 qt_cp26_dominion_11:0 "Eyes of the Founders"
 qt_cp26_dominion_11_desc:0 "The Founders must know the fears and divisions of every potential rival. Complete a successful espionage mission."
 qt_cp26_dominion_12:0 "Divide the Solids"
 qt_cp26_dominion_12_desc:0 "The safest enemy is one consumed by suspicion of its neighbors. Know four foreign empires and complete three successful spy missions."
 qt_cp26_dominion_13:0 "No Face, No Name"
 qt_cp26_dominion_13_desc:0 "A Founder can occupy any room and wear any face. Complete five successful spy missions while retaining the Influence to exploit what they reveal."
 qt_cp26_dominion_14:0 "The Dominion Advances"
 qt_cp26_dominion_14_desc:0 "Administration, military force and infiltration now serve one design. Establish a mature territorial base, fleet and intelligence network."
 qt_cp26_dominion_15:0 "The Warship of the Dominion"
 qt_cp26_dominion_15_desc:0 "As the Alpha Quadrant approaches its age of great wars, the Dominion commissions its heaviest capital ship. Reach the historical war era with a twenty-thousand-power fleet."
 qt_cp26_dominion_16:0 "What You Control Cannot Hurt You"
 qt_cp26_dominion_16_desc:0 "Nine worlds and an overwhelming fleet stand beneath the Great Link. The Dominion is prepared to impose peace on both sides of the wormhole."

