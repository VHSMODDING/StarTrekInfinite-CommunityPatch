 personality_cp26_romulan_republic_reformers_desc:0 "The Romulan Republic prioritizes domestic stability, frontier defense, and cautious cooperation with its partners."
 cp26_romulan_split.2.name:0 "The Romulan Schism"
 cp26_romulan_split.2.desc:0 "Romulus is gone. Two successor states have emerged: the Romulan Star Empire from Rator III, and the Romulan Republic on Mol'Rihan. Which future will you lead?"
 cp26_romulan_split.2.a:0 "Lead the Romulan Star Empire from Rator III."
 cp26_romulan_split.2.b:0 "Lead the Romulan Republic from Mol'Rihan."
 cp26_romulan_split.3.name:0 "The Future of Romulus"
 cp26_romulan_split.3.desc:0 "The destruction of Romulus has left only a scar in space. Its remains may still yield strategic resources, or stand as a permanent memorial to what was lost."
 cp26_romulan_split.3.a:0 "Recover the resources of Romulus."
 cp26_romulan_split.3.a.tt:0 "Adds mineral deposits to the shattered remains of Romulus."
 cp26_romulan_split.3.b:0 "Honor Romulus."
 cp26_romulan_split.3.b.tt:0 "Preserve the site as a memorial."
