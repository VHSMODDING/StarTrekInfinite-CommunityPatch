 CP26_DOMINION_REACTOR:0 "Dominion Antimatter Reactor"
 CP26_DOMINION_REACTOR_DESC:0 "A high-output Dominion power core."
 CP26_DOMINION_IMPULSE_ENGINE:0 "Dominion Impulse Engine"
 CP26_DOMINION_IMPULSE_ENGINE_DESC:0 "A military impulse system optimized for aggressive maneuvers."
 CP26_DOMINION_INTERCEPTOR_COMPUTER:0 "Jem'Hadar Attack Doctrine"
 CP26_DOMINION_INTERCEPTOR_COMPUTER_DESC:0 "Orders attack ships to close rapidly and remain on their target."
 CP26_DOMINION_LINE_COMPUTER:0 "Dominion Line Doctrine"
 CP26_DOMINION_LINE_COMPUTER_DESC:0 "Coordinates capital ships while Jem'Hadar attack craft screen the formation."

