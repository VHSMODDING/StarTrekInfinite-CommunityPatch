 cp26_dominion:0 "Dominion"
 cp26_dominion_desc:0 "A hierarchical Gamma Quadrant power ruled by the Founders and administered by their genetically engineered servants."
 auth_cp26_great_link:0 "Great Link"
 auth_cp26_great_link_desc:0 "The Founders govern as a single fluid collective. Their will is executed by the Vorta and enforced by the Jem'Hadar."
 gov_cp26_great_link:0 "Dominion Hierarchy"
 gov_cp26_great_link_desc:0 "An absolute order in which every subject has a prescribed function beneath the Founders."
 RT_CP26_FOUNDER:0 "Founder"
 civic_cp26_great_link:0 "Will of the Founders"
 civic_cp26_great_link_desc:0 "The Great Link provides the Dominion with an enduring, unified purpose."
 civic_cp26_engineered_castes:0 "Engineered Servitor Castes"
 civic_cp26_engineered_castes_desc:0 "The Vorta administer and negotiate; the Jem'Hadar fight. Both were designed for obedience."

 trait_cp26_founder_shapeshifter:0 "Founder Shapeshifter"
 trait_cp26_founder_shapeshifter_desc:0 "This species can assume almost any form and possesses an exceptionally long natural lifespan."
 trait_cp26_vorta_cloned_administrator:0 "Cloned Administrator"
 trait_cp26_vorta_cloned_administrator_desc:0 "Successive clones preserve the skills needed to administer the Dominion and serve the Founders."
 trait_cp26_jemhadar_engineered_soldier:0 "Engineered Soldier"
 trait_cp26_jemhadar_engineered_soldier_desc:0 "This species was engineered to mature rapidly, obey without hesitation and excel in combat."

 tech_cp26_dominion_attack_ship:0 "Jem'Hadar Attack Ship"
 tech_cp26_dominion_attack_ship_desc:0 "A fast, compact warship designed for aggressive close-range attacks and coordinated formations."
 tech_cp26_dominion_battle_cruiser:0 "Dominion Battle Cruiser"
 tech_cp26_dominion_battle_cruiser_desc:0 "A heavy command vessel able to anchor Jem'Hadar attack groups."
 tech_cp26_dominion_battleship:0 "Dominion Battleship"
 tech_cp26_dominion_battleship_desc:0 "An immense late-war capital ship whose firepower rivals several conventional cruisers."
 tech_cp26_dominion_polaron_beam:0 "Phased Polaron Beams"
 tech_cp26_dominion_polaron_beam_desc:0 "Polaron modulation allows part of the beam to penetrate conventional defensive shields until suitable countermeasures are developed."
 tech_cp26_dominion_polaron_torpedo:0 "Polaron Torpedoes"
 tech_cp26_dominion_polaron_torpedo_desc:0 "Torpedoes tuned to exploit the same shield vulnerabilities as Dominion polaron beams."
 tech_cp26_jemhadar_cloning:0 "Jem'Hadar Birthing Chambers"
 tech_cp26_jemhadar_cloning_desc:0 "Accelerated gestation and conditioning produce combat-ready Jem'Hadar in a matter of days."
 tech_cp26_ketracel_white:0 "Ketracel White Logistics"
 tech_cp26_ketracel_white_desc:0 "A tightly controlled supply network sustains Jem'Hadar forces and reinforces their dependence on the Dominion."

 CP26_DOMINION_POLARON:0 "Phased Polaron Beam"
 CP26_DOMINION_POLARON_DESC:0 "A Dominion energy weapon whose phase modulation partially bypasses conventional shields."
 CP26_DOMINION_POLARON_TORPEDO:0 "Polaron Torpedo"
 CP26_DOMINION_POLARON_TORPEDO_DESC:0 "A Dominion torpedo designed to exploit shield vulnerabilities."
