l_french:

 # ── Ferengi Quest Tree ──────────────────────────────────────────────────

 # A1 - Règle 1
 qt_ferengi_a1:0                "Règle 1"
 qt_ferengi_a1_desc:0           "« Une fois que tu as leur argent, ne le rends jamais. »\n\nLes Règles de l'Acquisition ne sont pas de simples proverbes - ce sont des lois. Établissez trois pactes commerciaux pour ancrer l'Alliance dans l'économie galactique."

 # A2 - Règle 2
 qt_ferengi_a2:0                "Règle 2"
 qt_ferengi_a2_desc:0           "« Ne laisse jamais la famille se mettre entre toi et une opportunité. »\n\nLes liens du sang ne valent rien face au profit. Établissez deux traités migratoires pour démontrer que l'Alliance sait exploiter chaque ressource disponible."

 # A3 - Règle 3
 qt_ferengi_a3:0                "Règle 3"
 qt_ferengi_a3_desc:0           "« La guerre est bonne pour les affaires. »\n\nPendant que les autres se battent pour des idéaux, l'Alliance se bat pour le profit. Vendez des armes pendant la crise de Bajor, ou conservez trois mille crédits énergétiques pendant que l'Alliance est en guerre."
 qt_ferengi_a3_weapons_tooltip_success:0 "£trigger_yes£ Profit tiré de la crise de §YBajor§!, ou §Y3000§! crédits énergétiques détenus en temps de guerre"
 qt_ferengi_a3_weapons_tooltip_fail:0    "£trigger_no£ Profiter de la crise de §YBajor§!, ou détenir §Y3000§! crédits énergétiques en temps de guerre"

 # A4 - Règle 4
 qt_ferengi_a4:0                "Règle 4"
 qt_ferengi_a4_desc:0           "« La paix est bonne pour les affaires. »\n\nLes guerres ferment des routes commerciales. Un Ferengi avisé sait quand négocier la paix - ou envoyer une flotte pour accélérer les choses. Proposez la paix lors d'un conflit, ou envoyez une flotte à Bajor."
 qt_ferengi_a4_peace_tooltip_success:0  "£trigger_yes£ Paix proposée lors d'une guerre, ou flotte militaire envoyée à §YBajor§!"
 qt_ferengi_a4_peace_tooltip_fail:0     "£trigger_no£ Aucune proposition de paix, aucune flotte envoyée à §YBajor§!"

 # A5 - Règle 5
 qt_ferengi_a5:0                "Règle 5"
 qt_ferengi_a5_desc:0           "« Étends-toi ou meurs. »\n\nLa stagnation, c'est la mort. Un Ferengi qui cesse de croître cesse de gagner. L'Alliance doit planter son drapeau sur de nouveaux mondes - trois colonies au-delà de Ferenginar, pour montrer à la Galaxie que notre appétit ne connaît pas de limites."

 # A6 - Règle 6
 qt_ferengi_a6:0                "Règle 6"
 qt_ferengi_a6_desc:0           "« Les conseils gratuits coûtent souvent cher. »\n\nChaque conseil a un prix. Employez deux émissaires et maintenez deux accords de recherche afin que chaque échange de connaissances profite à l'Alliance."

 # A7 - Règle 7
 qt_ferengi_a7:0                "Règle 7"
 qt_ferengi_a7_desc:0           "« De temps en temps, déclare la paix. Ça perturbe complètement tes ennemis. »\n\nL'imprévisibilité est une arme. Un Ferengi qui se bat toujours est aussi prévisible qu'un Klingon. Prenez vos rivaux par surprise - déclarez un statu quo et laissez-les se demander ce que vous préparez."
 qt_ferengi_a7_peace_tooltip_success:0  "£trigger_yes£ Un statu quo a été déclaré"
 qt_ferengi_a7_peace_tooltip_fail:0     "£trigger_no£ Aucun statu quo déclaré"

 # A8 - Règle 8
 qt_ferengi_a8:0                "Règle 8"
 qt_ferengi_a8_desc:0           "« Chaque homme a son prix. »\n\nConnaissez ce que veulent vos adversaires, et ils sont à vous. L'Alliance investit dans les meilleurs esprits et les guerriers les plus décorés - trois scientifiques pour percer les secrets de l'univers, et trois amiraux pour faire respecter les termes de n'importe quel accord."
 qt_ferengi_a8_scientists_tooltip_success:0 "£trigger_yes£ Scientifiques : §Y[This.qt_ferengi_a8_scientists]§!/§Y3§!"
 qt_ferengi_a8_scientists_tooltip_fail:0    "£trigger_no£ Scientifiques : §Y[This.qt_ferengi_a8_scientists]§!/§Y3§!"
 qt_ferengi_a8_admirals_tooltip_success:0   "£trigger_yes£ Amiraux : §Y[This.qt_ferengi_a8_admirals]§!/§Y3§!"
 qt_ferengi_a8_admirals_tooltip_fail:0      "£trigger_no£ Amiraux : §Y[This.qt_ferengi_a8_admirals]§!/§Y3§!"

 # A9 - Règle 9
 qt_ferengi_a9:0                "Règle 9"
 qt_ferengi_a9_desc:0           "« Garde les oreilles ouvertes. »\n\nL'information est la monnaie la plus précieuse de la Galaxie. Pendant que les autres font la guerre avec des flottes, l'Alliance la fait avec des secrets. Réussissez trois missions d'espionnage pour prouver que l'Alliance sait écouter."

 # A10 - Règle 10
 qt_ferengi_a10:0               "Règle 10"
 qt_ferengi_a10_desc:0          "« Opportunité plus instinct égale profit. »\n\nLes plus grandes fortunes ne sont pas bâties par chance, mais en reconnaissant une opportunité avant tout le monde et en agissant sans hésitation. Construisez cinq mégastructures - des monuments à l'ambition Ferengi gravés dans le tissu de la Galaxie."

 # A11-A16 - branches CP26 complétées et conclusion
 qt_ferengi_a11:0               "Des marchés sans frontières"
 qt_ferengi_a11_desc:0          "Un client sur un monde est une opportunité. Des clients sur chaque monde forment un empire. Maintenez au moins trois plateformes orbitales ferengies actives dans des empires partenaires étrangers."
 qt_ferengi_a12:0               "Le portefeuille orbital"
 qt_ferengi_a12_desc:0          "Aucun marché ne doit dépendre d'un seul produit. Maîtrisez les enclaves du Grand Nagus, les plateformes d'acquisition et les franchises orbitales de Quark."
 qt_ferengi_a13:0               "Protéger l'investissement"
 qt_ferengi_a13_desc:0          "Le profit attire les clients, les concurrents et les voleurs. Conservez dix mille crédits énergétiques et déployez une puissance navale suffisante pour faire respecter chaque contrat."
 qt_ferengi_a14:0               "Réseau de franchises galactique"
 qt_ferengi_a14_desc:0          "Transformez la diplomatie en revenus réguliers. Maintenez cinq pactes commerciaux et un revenu d'au moins 150 crédits énergétiques par mois."
 qt_ferengi_a15:0               "Actifs liquides"
 qt_ferengi_a15_desc:0          "Un Grand Nagus doit pouvoir acheter une opportunité dès qu'elle apparaît. Accumulez quinze mille crédits énergétiques, sept mille cinq cents minerais et cinq cents points d'influence."
 qt_ferengi_a16:0               "Le grand livre du Grand Nagus"
 qt_ferengi_a16_desc:0          "Chaque marché, plateforme et contrat alimente désormais le même grand livre. L'Alliance ferengie est devenue une puissance commerciale galactique dont l'influence se mesure en profits."

