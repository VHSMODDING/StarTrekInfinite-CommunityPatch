 personality_cp26_romulan_republic_reformers:0 "République protectionniste"
 personality_cp26_romulan_republic_reformers_desc:0 "La Romulan Republic privilégie la stabilité intérieure, la défense de ses frontières et une coopération prudente avec ses partenaires."
 cp26_romulan_split.2.name:0 "Le schisme romulien"
 cp26_romulan_split.2.desc:0 "Romulus a disparu. Deux États lui succèdent : le Romulan Star Empire, établi sur Rator III, et la Romulan Republic, sur Mol'Rihan. Quel avenir conduirez-vous ?"
 cp26_romulan_split.2.a:0 "Diriger le Romulan Star Empire depuis Rator III."
 cp26_romulan_split.2.b:0 "Diriger la Romulan Republic depuis Mol'Rihan."
 cp26_romulan_split.3.name:0 "L'avenir de Romulus"
 cp26_romulan_split.3.desc:0 "La destruction de Romulus n'a laissé qu'une cicatrice dans l'espace. Ses vestiges peuvent encore fournir des ressources stratégiques, ou devenir un mémorial permanent de ce qui a été perdu."
 cp26_romulan_split.3.a:0 "Récupérer les ressources de Romulus."
 cp26_romulan_split.3.a.tt:0 "Ajoute des gisements minéraux aux vestiges brisés de Romulus."
 cp26_romulan_split.3.b:0 "Honorer Romulus."
 cp26_romulan_split.3.b.tt:0 "Préserver le site comme mémorial."
