l_french:
 qt_cp26_dominion_1:0 "Le Grand Lien"
 qt_cp26_dominion_1_desc:0 "Les Fondateurs sont le Dominion, et le Dominion perdure par le Grand Lien. Préservons leur ordre grâce à l'administration vorta, à la force jem'hadar et au contrôle absolu de l'information."
 qt_cp26_dominion_2:0 "Administration vorta"
 qt_cp26_dominion_2_desc:0 "Les administrateurs vorta transforment la volonté des Fondateurs en quotas, traités et ressources. Maintenons de solides revenus en énergie et en minerais."
 qt_cp26_dominion_3:0 "Les mondes du Dominion"
 qt_cp26_dominion_3_desc:0 "L'ordre doit s'étendre au-delà du monde des Fondateurs. Contrôlons au moins trois mondes colonisés."
 qt_cp26_dominion_4:0 "L'obéissance mène à la victoire"
 qt_cp26_dominion_4_desc:0 "Chaque nouveau monde doit comprendre sa place dans la hiérarchie. Contrôlons cinq colonies et conservons assez d'influence pour imposer la volonté des Fondateurs."
 qt_cp26_dominion_5:0 "L'ordre dans le quadrant Gamma"
 qt_cp26_dominion_5_desc:0 "Le Dominion n'est pas un monde, mais un système d'ordre absolu. Contrôlons sept colonies et entretenons une puissante production d'unité."
 qt_cp26_dominion_6:0 "Les Jem'Hadar"
 qt_cp26_dominion_6_desc:0 "Les Jem'Hadar sont élevés pour combattre et mourir au service des Fondateurs. Déployons une flotte digne de leur loyauté."
 qt_cp26_dominion_7:0 "Le Blanc"
 qt_cp26_dominion_7_desc:0 "Le Ketracel blanc soutient les Jem'Hadar et garantit leur obéissance. Constituons une réserve stratégique pour les armées du Dominion."
 qt_cp26_dominion_8:0 "La victoire, c'est la vie"
 qt_cp26_dominion_8_desc:0 "Pour les Jem'Hadar, le devoir et la survie ne font qu'un. Renforçons la flotte et accumulons les alliages nécessaires au remplacement de chaque perte."
 qt_cp26_dominion_9:0 "Flotte de guerre du Dominion"
 qt_cp26_dominion_9_desc:0 "Vaisseaux d'attaque et croiseurs de bataille doivent former un instrument implacable. Atteignons quatorze mille de puissance de flotte et une production navale soutenue."
 qt_cp26_dominion_10:0 "Diplomatie vorta"
 qt_cp26_dominion_10_desc:0 "Une voix courtoise ouvre parfois un monde plus efficacement qu'un vaisseau de guerre. Établissons des communications avec deux empires étrangers."
 qt_cp26_dominion_11:0 "Les yeux des Fondateurs"
 qt_cp26_dominion_11_desc:0 "Les Fondateurs doivent connaître les peurs et les divisions de chaque rival potentiel. Menons une mission d'espionnage à bien."
 qt_cp26_dominion_12:0 "Diviser les Solides"
 qt_cp26_dominion_12_desc:0 "L'ennemi le plus sûr est celui que consume la méfiance envers ses voisins. Connaissons quatre empires étrangers et réussissons trois missions d'espionnage."
 qt_cp26_dominion_13:0 "Sans visage, sans nom"
 qt_cp26_dominion_13_desc:0 "Un Fondateur peut occuper n'importe quelle pièce et prendre n'importe quel visage. Réussissons cinq missions d'espionnage et gardons l'influence nécessaire pour exploiter leurs résultats."
 qt_cp26_dominion_14:0 "Le Dominion avance"
 qt_cp26_dominion_14_desc:0 "Administration, force militaire et infiltration servent désormais un seul dessein. Établissons une base territoriale, navale et clandestine arrivée à maturité."
 qt_cp26_dominion_15:0 "Le vaisseau de guerre du Dominion"
 qt_cp26_dominion_15_desc:0 "Alors que le quadrant Alpha entre dans l'ère des grandes guerres, le Dominion met en service son plus lourd vaisseau capital. Atteignons l'époque historique du conflit avec vingt mille de puissance de flotte."
 qt_cp26_dominion_16:0 "Ce que l'on contrôle ne peut nous nuire"
 qt_cp26_dominion_16_desc:0 "Neuf mondes et une flotte écrasante se tiennent sous le Grand Lien. Le Dominion est prêt à imposer la paix des deux côtés du vortex."

