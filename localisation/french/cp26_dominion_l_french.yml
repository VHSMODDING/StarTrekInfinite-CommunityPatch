 cp26_dominion:0 "Dominion"
 cp26_dominion_desc:0 "Une puissance hiérarchique du Quadrant Gamma, dirigée par les Fondateurs et administrée par leurs serviteurs génétiquement conçus."
 auth_cp26_great_link:0 "Grand Lien"
 auth_cp26_great_link_desc:0 "Les Fondateurs gouvernent comme un collectif fluide unique. Leur volonté est exécutée par les Vortas et imposée par les Jem'Hadar."
 gov_cp26_great_link:0 "Hiérarchie du Dominion"
 gov_cp26_great_link_desc:0 "Un ordre absolu dans lequel chaque sujet remplit une fonction déterminée sous l'autorité des Fondateurs."
 RT_CP26_FOUNDER:0 "Fondateur"
 civic_cp26_great_link:0 "Volonté des Fondateurs"
 civic_cp26_great_link_desc:0 "Le Grand Lien donne au Dominion une volonté unifiée et durable."
 civic_cp26_engineered_castes:0 "Castes serviles conçues"
 civic_cp26_engineered_castes_desc:0 "Les Vortas administrent et négocient ; les Jem'Hadar combattent. Tous ont été conçus pour obéir."

 trait_cp26_founder_shapeshifter:0 "Fondateur métamorphe"
 trait_cp26_founder_shapeshifter_desc:0 "Cette espèce peut prendre presque toutes les formes et possède une longévité naturelle exceptionnelle."
 trait_cp26_vorta_cloned_administrator:0 "Administrateur cloné"
 trait_cp26_vorta_cloned_administrator_desc:0 "Des clones successifs préservent les compétences nécessaires pour administrer le Dominion et servir les Fondateurs."
 trait_cp26_jemhadar_engineered_soldier:0 "Soldat génétiquement conçu"
 trait_cp26_jemhadar_engineered_soldier_desc:0 "Cette espèce a été conçue pour mûrir rapidement, obéir sans hésitation et exceller au combat."

 tech_cp26_dominion_attack_ship:0 "Vaisseau d'attaque Jem'Hadar"
 tech_cp26_dominion_attack_ship_desc:0 "Un vaisseau rapide et compact, conçu pour les assauts agressifs à courte portée et les formations coordonnées."
 tech_cp26_dominion_battle_cruiser:0 "Croiseur de bataille du Dominion"
 tech_cp26_dominion_battle_cruiser_desc:0 "Un lourd bâtiment de commandement capable d'encadrer les groupes d'attaque Jem'Hadar."
 tech_cp26_dominion_battleship:0 "Cuirassé du Dominion"
 tech_cp26_dominion_battleship_desc:0 "Un immense vaisseau capital de la fin de la guerre, dont la puissance équivaut à celle de plusieurs croiseurs conventionnels."
 tech_cp26_dominion_polaron_beam:0 "Faisceaux polaron phasés"
 tech_cp26_dominion_polaron_beam_desc:0 "La modulation polaron permet à une partie du faisceau de traverser les boucliers conventionnels jusqu'à la mise au point de contre-mesures adaptées."
 tech_cp26_dominion_polaron_torpedo:0 "Torpilles polaron"
 tech_cp26_dominion_polaron_torpedo_desc:0 "Des torpilles réglées pour exploiter les mêmes faiblesses des boucliers que les faisceaux polaron du Dominion."
 tech_cp26_jemhadar_cloning:0 "Chambres de gestation Jem'Hadar"
 tech_cp26_jemhadar_cloning_desc:0 "Une gestation et un conditionnement accélérés produisent des Jem'Hadar prêts au combat en quelques jours."
 tech_cp26_ketracel_white:0 "Logistique du Ketracel blanc"
 tech_cp26_ketracel_white_desc:0 "Un réseau d'approvisionnement étroitement contrôlé soutient les forces Jem'Hadar et renforce leur dépendance envers le Dominion."

 CP26_DOMINION_POLARON:0 "Faisceau polaron phasé"
 CP26_DOMINION_POLARON_DESC:0 "Une arme énergétique du Dominion dont la modulation de phase traverse partiellement les boucliers conventionnels."
 CP26_DOMINION_POLARON_TORPEDO:0 "Torpille polaron"
 CP26_DOMINION_POLARON_TORPEDO_DESC:0 "Une torpille du Dominion conçue pour exploiter les faiblesses des boucliers."
 CP26_SMALL_DOMINION_POLARON:0 "Petit faisceau polaron phasé"
 CP26_SMALL_DOMINION_POLARON_DESC:0 "$CP26_DOMINION_POLARON_DESC$"
 CP26_MEDIUM_DOMINION_POLARON:0 "Faisceau polaron phasé moyen"
