 CP26_MEDIUM_DOMINION_POLARON_TORPEDO:0 "Lance-torpilles polaron"
 CP26_MEDIUM_DOMINION_POLARON_TORPEDO_DESC:0 "$CP26_DOMINION_POLARON_TORPEDO_DESC$"
 CP26_DOMINION_REACTOR:0 "Réacteur à antimatière du Dominion"
 CP26_DOMINION_REACTOR_DESC:0 "Un cœur énergétique du Dominion à haut rendement."
 CP26_DOMINION_IMPULSE_ENGINE:0 "Moteur à impulsion du Dominion"
 CP26_DOMINION_IMPULSE_ENGINE_DESC:0 "Un système d'impulsion militaire optimisé pour les manœuvres agressives."
 CP26_DOMINION_INTERCEPTOR_COMPUTER:0 "Doctrine d'attaque Jem'Hadar"
 CP26_DOMINION_INTERCEPTOR_COMPUTER_DESC:0 "Ordonne aux vaisseaux d'attaque de fondre rapidement sur leur cible et de ne plus la lâcher."
 CP26_DOMINION_LINE_COMPUTER:0 "Doctrine de ligne du Dominion"
 CP26_DOMINION_LINE_COMPUTER_DESC:0 "Coordonne les vaisseaux capitaux pendant que les bâtiments d'attaque Jem'Hadar protègent la formation."

